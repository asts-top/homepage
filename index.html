<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, PW | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0a;
            --card: rgba(255,255,255,0.05);
            --card-hover: rgba(255,255,255,0.1);
            --lime: #D4E157;
            --cyan: #00ffff;
            --text: #ffffff;
            --text2: rgba(255,255,255,0.5);
            --radius: 16px;
            --panel-width: 280px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 矩阵背景 */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
        }

        /* 扫描线 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* 主布局 */
        .layout {
            position: relative;
            z-index: 10;
            display: flex;
            min-height: 100vh;
        }

        /* 主内容区 */
        .main {
            flex: 1;
            padding: 40px;
            padding-top: 8vh;
            margin-right: var(--panel-width);
        }

        /* 标题 */
        .header {
            margin-bottom: 50px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #fff;
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--lime),
                0 0 40px var(--lime),
                0 0 80px var(--lime);
            animation: breathe 4s ease-in-out infinite alternate;
        }

        /* 呼吸动画 */
        @keyframes breathe {
            0% { opacity: 0.9; text-shadow: 0 0 20px var(--lime), 0 0 40px var(--lime); }
            100% { opacity: 1; text-shadow: 0 0 20px var(--lime), 0 0 40px var(--lime), 0 0 80px var(--lime), 0 0 100px var(--lime); }
        }

        /* Glitch 故障特效 - 只影响文字部分 */
        .title::before,
        .title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: auto;
            height: 100%;
            background: var(--bg);
            z-index: -1;
        }

        .title::before {
            left: 2px;
            text-shadow: -2px 0 #00ffff;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            animation: glitch-1 2.5s infinite linear alternate-reverse;
        }

        .title::after {
            left: -2px;
            text-shadow: 2px 0 #ff00ff;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            animation: glitch-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 60% 0); }
            100% { clip-path: inset(30% 0 30% 0); }
        }

        @keyframes glitch-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(10% 0 80% 0); }
            60% { clip-path: inset(50% 0 10% 0); }
            80% { clip-path: inset(70% 0 20% 0); }
            100% { clip-path: inset(20% 0 40% 0); }
        }

        .title .wave-emoji {
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
            text-shadow: none;
            position: relative;
            z-index: 10;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-10deg); }
        }

        .subtitle {
            color: var(--text2);
            font-size: 16px;
            min-height: 24px;
        }

        /* 打字机光标 */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--lime);
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 访客计数器 */
        .visitor-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text2);
            margin-top: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .visitor-counter:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--lime);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(212, 225, 87, 0.2);
        }

        .visitor-counter svg {
            width: 14px;
            height: 14px;
            color: var(--lime);
            transition: transform 0.3s ease;
        }

        .visitor-counter:hover svg {
            transform: scale(1.2);
        }

        /* 搜索框 */
        .search-box {
            max-width: 400px;
            margin: 30px 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: var(--card);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }

        .search-input::placeholder { color: var(--text2); }

        .search-input:hover {
            border-color: rgba(212, 225, 87, 0.3);
            background: rgba(255,255,255,0.08);
        }

        .search-input:focus {
            border-color: var(--lime);
            box-shadow: 0 0 25px rgba(212, 225, 87, 0.3);
            background: rgba(255,255,255,0.1);
        }

        /* 箭头脉冲动画 */
        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text2);
            width: 20px;
        }

        .search-hint {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text2);
        }

        /* 赛博朋克纯文字按钮样式 */
        .cyber-card {
            text-decoration: none;
            display: block;
            position: relative;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .cyber-card:hover {
            transform: translateY(-3px);
        }

        .cyber-btn {
            border: 2px solid var(--lime);
            padding: 20px 24px;
            background: transparent;
            color: var(--lime);
            font-family: 'Orbitron', 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            clip-path: polygon(
                12px 0, 100% 0, 
                100% calc(100% - 12px), calc(100% - 12px) 100%, 
                0 100%, 0 12px
            );
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* 扫描线动画背景 */
        .cyber-btn::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                transparent 0%,
                rgba(212, 225, 87, 0.1) 50%,
                transparent 100%
            );
            transition: top 0.4s ease;
        }

        .cyber-card:hover .cyber-btn::after {
            top: 100%;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background: var(--lime);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .cyber-card:hover .cyber-btn::before {
            width: 100%;
            height: 3px;
        }

        .cyber-btn .label {
            color: var(--lime);
            transition: all 0.25s ease;
            position: relative;
            z-index: 1;
        }

        .cyber-btn .arrow {
            opacity: 0;
            transform: translateX(-15px);
            transition: all 0.3s ease;
            font-weight: bold;
            color: var(--lime);
            font-family: monospace;
            font-size: 1rem;
            position: relative;
            z-index: 1;
        }

        .cyber-card:hover .cyber-btn {
            background: var(--lime);
            color: #000;
            box-shadow: 
                0 0 30px rgba(212, 225, 87, 0.5),
                0 10px 40px rgba(212, 225, 87, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            padding-left: 32px;
            border-color: #fff;
        }

        .cyber-card:hover .cyber-btn .label {
            color: #000;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .cyber-card:hover .cyber-btn .arrow {
            opacity: 1;
            transform: translateX(0);
            animation: arrowPulse 0.8s ease infinite;
            color: #000;
        }
</style>
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="scanlines"></div>

<div class="layout">
    <main class="main">
        <header class="header">
            <h1 class="title" data-text="Hi, PW">Hi, PW <span class="wave-emoji">👋</span></h1>
            <p class="subtitle"><span id="typewriter"></span><span class="typing-cursor"></span></p>
            <div class="visitor-counter">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <span>Visitors: <span id="visitorCount">---</span></span>
            </div>
        </header>

        <div class="search-box">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search services...">
            <span class="search-hint">/</span>
        </div>

        <!-- 服务卡片 - 赛博朋克纯文字风格 -->
        <div id="navGrid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
            
            <a href="http://blog.hipw.cc" class="card cyber-card">
                <div class="cyber-btn">
                    <span class="label">[ BLOG ]</span>
                    <span class="arrow">&gt;&gt;&gt;</span>
                </div>
            </a>

            <a href="http://pan.hipw.cc" class="card cyber-card">
                <div class="cyber-btn">
                    <span class="label">[ PAN ]</span>
                    <span class="arrow">&gt;&gt;&gt;</span>
                </div>
            </a>

            <a href="http://api.hipw.cc" class="card cyber-card">
                <div class="cyber-btn">
                    <span class="label">[ API ]</span>
                    <span class="arrow">&gt;&gt;&gt;</span>
                </div>
            </a>

            <a href="http://panel.hipw.cc" class="card cyber-card">
                <div class="cyber-btn">
                    <span class="label">[ PANEL ]</span>
                    <span class="arrow">&gt;&gt;&gt;</span>
                </div>
            </a>

            <a href="http://gcli.hipw.cc" class="card cyber-card">
                <div class="cyber-btn">
                    <span class="label">[ GCLI ]</span>
                    <span class="arrow">&gt;&gt;&gt;</span>
                </div>
            </a>

            <a href="http://image.hipw.cc" class="card cyber-card">
                <div class="cyber-btn">
                    <span class="label">[ IMAGE ]</span>
                    <span class="arrow">&gt;&gt;&gt;</span>
                </div>
            </a>
        </div>
    </main>

    <!-- 右侧面板 -->
    <aside style="width: var(--panel-width); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 24px 16px; position: fixed; right: 0; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column;">
        
        <!-- 最近访问容器 -->
        <div style="background: rgba(255,255,255,0.03); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.08); flex: 1;">
            <div style="font-size: 10px; font-weight: 600; color: var(--lime); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; display: flex; align-items: center; gap: 6px;">
                <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Recent Visits
            </div>
            <div id="recentList" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- 底部固定区域 -->
        <div style="margin-top: 16px;">
            <!-- 时钟 -->
            <div style="background: var(--card); border-radius: 12px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.05);">
                <div id="clockTime" style="font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: var(--lime);">00:00:00</div>
                <div id="clockDate" style="font-size: 11px; color: var(--text2); margin-top: 4px;">Loading...</div>
            </div>

            <!-- 状态 -->
            <div style="display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--card); border-radius: 10px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="width: 6px; height: 6px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 8px #22C55E;"></div>
                <span style="font-size: 10px; color: var(--text2);">ONLINE • v2.0</span>
            </div>
        </div>
    </aside>
</div>


<script>
// 矩阵代码雨
const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const chars = '01アイウエオカキクケコサシスセソ';
const arr = chars.split('');
const fontSize = 14;
const cols = w / fontSize;
const drops = Array(Math.floor(cols)).fill(1);

function drawMatrix() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#D4E157';
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const text = arr[Math.floor(Math.random() * arr.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 33);

window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

// 时钟
function updateClock() {
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-US', { hour12: false });
    document.getElementById('clockDate').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 1000);

// 搜索
document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
        c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
});

// 键盘快捷键
document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
    }
    if (e.key === 'Escape') {
        document.getElementById('searchInput').value = '';
        document.getElementById('searchInput').blur();
        document.querySelectorAll('.card').forEach(c => c.style.display = '');
    }
});

// 卡片悬停音效（可选）
document.querySelectorAll('.cyber-card').forEach(c => {
    c.addEventListener('mouseenter', () => {
        // 可以添加音效
    });
});

// 右侧面板链接悬停
document.querySelectorAll('aside a').forEach(a => {
    a.addEventListener('mouseenter', () => {
        a.style.background = 'var(--card-hover)';
        a.style.borderColor = 'rgba(212, 225, 87, 0.3)';
    });
    a.addEventListener('mouseleave', () => {
        a.style.background = 'var(--card)';
        a.style.borderColor = 'rgba(255,255,255,0.05)';
    });
});

// 打字机效果
const phrases = [
    "Welcome to the Command Center",
    "All systems operational",
    "Ready to explore?",
    "The Gateway Awaits",
    "Let's Explore"
];
let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;
const typewriter = document.getElementById('typewriter');

function type() {
    const currentPhrase = phrases[phraseIndex];
    
    if (isDeleting) {
        typewriter.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;
    } else {
        typewriter.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;
    }
    
    let delay = isDeleting ? 30 : 80;
    
    if (!isDeleting && charIndex === currentPhrase.length) {
        delay = 2000;
        isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
        delay = 500;
    }
    
    setTimeout(type, delay);
}
type();

// 访客计数器
let visits = localStorage.getItem('visitCount') || 0;
visits = parseInt(visits) + 1;
localStorage.setItem('visitCount', visits);
document.getElementById('visitorCount').textContent = visits.toLocaleString();

// 服务数据
const services = {
    'blog.hipw.cc': { name: 'Blog', desc: 'Articles', color: 'linear-gradient(135deg, #1a1a1a, #333)', icon: '<svg width="18" height="18" fill="none" stroke="var(--lime)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>' },
    'pan.hipw.cc': { name: 'Pan', desc: 'Files', color: 'linear-gradient(135deg, #4338ca, #6366f1)', icon: '<svg width="18" height="18" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>' },
    'api.hipw.cc': { name: 'API', desc: 'Services', color: 'linear-gradient(135deg, #d97706, #f59e0b)', icon: '<svg width="18" height="18" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' },
    'panel.hipw.cc': { name: 'Panel', desc: 'Control', color: 'linear-gradient(135deg, #7c3aed, #8b5cf6)', icon: '<svg width="18" height="18" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6z"/></svg>' },
    'gcli.hipw.cc': { name: 'GCLI', desc: 'Terminal', color: '#000', icon: '<svg width="18" height="18" fill="none" stroke="#22c55e" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' },
    'image.hipw.cc': { name: 'Image', desc: 'Hosting', color: 'linear-gradient(135deg, #db2777, #ec4899)', icon: '<svg width="18" height="18" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' }
};

// 最近访问功能
function getRecentVisits() {
    return JSON.parse(localStorage.getItem('recentVisits') || '[]');
}

function addRecentVisit(url) {
    const host = new URL(url).host;
    let recent = getRecentVisits().filter(h => h !== host);
    recent.unshift(host);
    recent = recent.slice(0, 3);
    localStorage.setItem('recentVisits', JSON.stringify(recent));
}

function renderRecentVisits() {
    const recent = getRecentVisits();
    const container = document.getElementById('recentList');
    
    // 始终显示 3 个格子
    let html = '';
    for (let i = 0; i < 3; i++) {
        const host = recent[i];
        const s = host ? services[host] : null;
        
        if (s) {
            html += `<a href="http://${host}" class="recent-link" style="display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; text-decoration: none; color: var(--text); transition: all 0.2s; border: 1px solid rgba(255,255,255,0.05);">
                <div style="width: 36px; height: 36px; background: ${s.color}; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">${s.icon}</div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-weight: 500; font-size: 13px;">${s.name}</div>
                    <div style="font-size: 10px; color: var(--text2);">${s.desc}</div>
                </div>
                <svg width="14" height="14" fill="none" stroke="var(--text2)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>`;
        } else {
            html += `<div style="display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px dashed rgba(255,255,255,0.1);">
                <div style="width: 36px; height: 36px; background: rgba(255,255,255,0.03); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <span style="color: var(--text2); font-size: 16px;">?</span>
                </div>
                <div style="flex: 1;">
                    <div style="font-weight: 500; font-size: 13px; color: var(--text2);">Empty Slot</div>
                    <div style="font-size: 10px; color: rgba(255,255,255,0.3);">Click a service</div>
                </div>
            </div>`;
        }
    }
    container.innerHTML = html;
}

// 记录点击
document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
        addRecentVisit(card.href);
    });
});

renderRecentVisits();
</script>
